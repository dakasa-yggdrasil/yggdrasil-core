name: LAB Hetzner signed disposal fixture
on:
  push:
    branches: [codex/lab-hetzner-gen8-retirement-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-disposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: recovery_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: fixture
          RABBITMQ_DEFAULT_PASS: lab-only
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      CAPACITY_RECOVERY_FIXTURE_ONLY: 'true'
      RECOVERY_FIXTURE_ADMIN_URL: 'postgres://postgres:fixture-only@127.0.0.1:5432/postgres?sslmode=disable'
      LAB_HETZNER_BROKER_URL: 'amqp://fixture:lab-only@127.0.0.1:5672/'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile exact legacy Core decoder
        shell: bash
        run: |
          set -euo pipefail
          legacy="$RUNNER_TEMP/core-legacy-2de"
          git worktree add --detach "$legacy" 2de33bbca46000d86a6dc0d5162383a6128e3517
          [[ "$(git -C "$legacy" rev-parse HEAD)" == 2de33bbca46000d86a6dc0d5162383a6128e3517 ]]
          cp repository/testdata/lab_core_bound_legacy_decode_test.go.txt "$legacy/repository/lab_core_bound_legacy_decode_test.go"
          (cd "$legacy" && GOWORK=off go test -p=1 -race -buildvcs=false -c -o "$RUNNER_TEMP/lab-legacy-2de.test" ./repository)
          printf 'LAB_HETZNER_LEGACY_TEST_BIN=%s\n' "$RUNNER_TEMP/lab-legacy-2de.test" >> "$GITHUB_ENV"
      - name: Execute signed synthetic installed Guest disposition
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          mkdir -p "$RUNNER_TEMP/lab-hetzner-signed"
          export LAB_HETZNER_HTTP_TEST_BIN="$RUNNER_TEMP/lab-hetzner-http.test"
          go test -p=1 -race -buildvcs=true -tags recoveryfixture -c -o "$LAB_HETZNER_HTTP_TEST_BIN" ./controllers/httpapi
          go test -p=1 -race -buildvcs=true -tags recoveryfixture -count=1 -timeout=5m -v ./repository -run '^TestRecoveryFixtureResumeSetupPostgres/lab_core_bound_disposal(_success|_complete)?$' 2>&1 | tee "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_CORE_BOUND_DISPOSAL_REQUESTED_READBACK_NO_DUPLICATE' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_HETZNER_CORE_BOUND_HTTPS_LOST_RESPONSE_GET_ONLY_ADVANCE_HELD' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_SIGNED_HTTP_COMMITTED_PG_WIRE_CORE2DE_HELD_UNCHANGED' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_CORE_BOUND_DISPOSAL_CLAIMED_FENCE_AND_REFUSAL_ROLLBACK' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_SYNTHETIC_RETIREMENT_V2_MTLS_ONE_WRITE_LOST_NO_REPLAY_CLEANUP_HELD' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_SYNTHETIC_V2_FOUR_SIGNED_RECORDS_ORIGINAL_CALLER_NATIVE_READ_PREPARED' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_SYNTHETIC_RETIREMENT_V2_OFF_CLEANUP_PENDING_NO_DELETE' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
          grep -F 'LAB_SYNTHETIC_HETZNER_TERMINAL_ABSENCE_NO_PROVIDER_NO_REPLAY' "$RUNNER_TEMP/lab-hetzner-signed/fixture.log"
      - name: Retain original test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-hetzner-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-hetzner-signed/
          if-no-files-found: warn
          retention-days: 7
