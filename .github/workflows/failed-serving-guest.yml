name: Failed serving Guest Source and PostgreSQL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-source-and-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: failed-serving-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '1'
      CAPACITY_RECOVERY_FIXTURE_ONLY: 'true'
      FAILED_SERVING_FIXTURE_ADMIN_URL: postgres://postgres:failed-serving-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      FAILED_SERVING_TEST_PG_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert exact source and fixture build exclusion
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          logs="$RUNNER_TEMP/failed-serving-source-pg$FAILED_SERVING_TEST_PG_MAJOR"
          mkdir -m 0700 "$logs"
          printf 'FAILED_SERVING_LOGS=%s\n' "$logs" >> "$GITHUB_ENV"
          go list -json ./repository > "$logs/build-default.json"
          go list -json -tags=recoveryfixture ./repository > "$logs/build-fixture.json"
          go list -json -tags=nativequalification ./repository > "$logs/build-native.json"
          go list -json -tags=recoveryfixture,nativequalification ./repository > "$logs/build-both.json"
          python3 - "$logs" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); target='failed_serving_recoveryfixture.go'
          for name,present in [('default',False),('fixture',True),('native',False),('both',False)]:
              row=json.loads((p/f'build-{name}.json').read_text())
              assert row['ImportPath']=='github.com/dakasa-yggdrasil/yggdrasil-core/repository'
              assert (target in row.get('GoFiles',[])) is present, (name,'fixture inclusion drift')
              assert (target in row.get('IgnoredGoFiles',[])) is (not present)
          print('FAILED_SERVING_FIXTURE_EXCLUDED_FROM_DEFAULT_AND_NATIVEQUALIFICATION')
          PY
      - name: Run exact schema93 Source, HTTP and bounded original-read cases
        shell: bash
        run: |
          set -Eeuo pipefail
          record() {
            local name="$1"; shift
            set +e
            "$@" > "$FAILED_SERVING_LOGS/$name.stdout" 2> "$FAILED_SERVING_LOGS/$name.stderr"
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$FAILED_SERVING_LOGS/$name.exit"
            return "$rc"
          }
          # Retain every package's original failure; fail before the passing
          # census if any native go command failed. No output replaces its exit.
          failed=0
          # Go's default buildvcs=auto omits test-binary VCS metadata. The
          # source-owned registry requires the real exact clean issuer build.
          record repository go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=8m -json ./repository -run '^TestFailedServing' || failed=1
          record message go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=5m -json ./controllers/message -run '^TestFailedServing' || failed=1
          record http go test -buildvcs=true -p=1 -race -count=1 -timeout=3m -json ./controllers/httpapi -run '^TestFailedServing' || failed=1
          [[ "$failed" == 0 ]]
          python3 - <<'PY'
          import collections,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['FAILED_SERVING_LOGS']); base='github.com/dakasa-yggdrasil/yggdrasil-core/'
          expected={
            'repository':('repository',[
              'TestFailedServingQuarantineLifecyclePostgres',
              'TestFailedServingQuarantineCASAndCentralGuardsPostgres',
              'TestFailedServingQuarantineRequiresCompleteExactFleetPostgres',
              'TestFailedServingObservationOwnerAndNativeOffPostgres',
              'TestFailedServingAbsenceRequiresAllAuxAndFleetZeroPostgres',
              'TestFailedServingPreservesDisposedUnknownACKNullAndHeldSendsPostgres',
              'TestFailedServingMigration88RejectsForgedLineageAndReplayPostgres',
              'TestFailedServingStableSurvivorBirthAndCurrentEpochPostgres',
              'TestFailedServingEligibilityAndCrossRealmAuthorityPostgres',
              'TestFailedServingTerminalBeginsNewOrdinaryFloorGenerationPostgres']),
            'message':('controllers/message',[
              'TestFailedServingSourceClosedReadOperations',
              'TestFailedServingSourceOwnerBoundedHTTPLifecyclePostgres',
              'TestFailedServingSourceReadFailureNeverCommitsOrRetriesPostgres']),
            'http':('controllers/httpapi',[
              'TestFailedServingDisposalClosedCASRequest',
              'TestFailedServingDisposalRequiresOperatorBeforeDatabaseOrBroker',
              'TestFailedServingDisposalSummaryClosedKeyAllowlist'])}
          summary={}
          for name,(package,roots) in expected.items():
              assert (p/(name+'.exit')).read_text().strip()=='0', name+' native go exit'
              rows=[json.loads(line) for line in (p/(name+'.stdout')).read_text().splitlines()]
              assert rows and all(r.get('Package')==base+package for r in rows),name+' package drift'
              assert not any(r['Action'] in ('skip','fail') for r in rows),name+' skipped/failed case'
              for action in ('run','pass'):
                  census=collections.Counter(r['Test'] for r in rows if r['Action']==action and 'Test' in r and '/' not in r['Test'])
                  assert census==collections.Counter(roots),(name,action,census)
              assert sum(r['Action']=='pass' and 'Test' not in r for r in rows)==1
              if name in ('repository','message'):
                  for root in roots:
                      if root=='TestFailedServingSourceClosedReadOperations':continue
                      for provider in ('aws','hetzner'):
                          assert sum(r['Action']=='pass' and r.get('Test')==root+'/'+provider for r in rows)==1,(root,provider)
              if name=='repository':
                  required='TestFailedServingMigration88RejectsForgedLineageAndReplayPostgres/workflow_busy_index89'
                  assert sum(r['Action']=='pass' and r.get('Test')==required for r in rows)==1,'mandatory real schema89 index/query/old88-Up subtest'
              summary[name]={'roots':roots,'passed':len(roots),'skipped':0}
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_COMMIT']
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'])
          value={'schema':'failed_serving_guest_Source_exact_CI_census_v1','source_commit':os.environ['SOURCE_COMMIT'],'schema_version':93,'postgres_major':int(os.environ['FAILED_SERVING_TEST_PG_MAJOR']),'race':True,'count':1,'total_roots':16,'summary':summary,'mandatory_schema89_index_subtest':True,'fixture_only':True,'cloud_SDK_execution':False,'native_Guest_qualification':False,'production_authority':False}
          (p/'CENSUS.PUBLIC.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          print(json.dumps(value,sort_keys=True))
          PY
      - name: Qualify separate schema94 unwitnessed expansion cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          record() {
            local name="$1"; shift
            set +e
            "$@" > "$FAILED_SERVING_LOGS/$name.stdout" 2> "$FAILED_SERVING_LOGS/$name.stderr"
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$FAILED_SERVING_LOGS/$name.exit"
            return "$rc"
          }
          failed=0
          record cleanup94-repository go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=4m -json ./repository -run '^TestFailedUnwitnessedExpansionCleanupPostgres(AdmissionOnce|ImmutableOriginals|OwnerAndWriteGates|WholeLifecycle)$' || failed=1
          record cleanup94-http go test -buildvcs=true -p=1 -race -count=1 -timeout=3m -json ./controllers/httpapi -run '^TestFailedUnwitnessedExpansionCleanup(RequiresAuthenticatedOperator|RejectsCallerEvidenceBeforeStorage|RequiresAdministrativeGrant|SummaryPreservesPrivateEvidenceAndFailure)$' || failed=1
          [[ "$failed" == 0 ]]
          python3 - <<'PY_CLEANUP94'
          import collections,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['FAILED_SERVING_LOGS']);base='github.com/dakasa-yggdrasil/yggdrasil-core/'
          expected={
            'cleanup94-repository':('repository',[
              'TestFailedUnwitnessedExpansionCleanupPostgresAdmissionOnce',
              'TestFailedUnwitnessedExpansionCleanupPostgresImmutableOriginals',
              'TestFailedUnwitnessedExpansionCleanupPostgresOwnerAndWriteGates',
              'TestFailedUnwitnessedExpansionCleanupPostgresWholeLifecycle']),
            'cleanup94-http':('controllers/httpapi',[
              'TestFailedUnwitnessedExpansionCleanupRequiresAuthenticatedOperator',
              'TestFailedUnwitnessedExpansionCleanupRejectsCallerEvidenceBeforeStorage',
              'TestFailedUnwitnessedExpansionCleanupRequiresAdministrativeGrant',
              'TestFailedUnwitnessedExpansionCleanupSummaryPreservesPrivateEvidenceAndFailure'])}
          summary={}
          for name,(package,roots) in expected.items():
              assert (p/(name+'.exit')).read_text().strip()=='0',name+' actual exit'
              rows=[json.loads(line) for line in (p/(name+'.stdout')).read_text().splitlines() if line.strip()]
              assert rows and all(r.get('Package')==base+package for r in rows),name+' package'
              assert not any(r.get('Action') in ('fail','skip') for r in rows),name+' no failed/skipped nodes'
              for action in ('run','pass'):
                  actual=collections.Counter(r['Test'] for r in rows if r.get('Action')==action and 'Test' in r and '/' not in r['Test'])
                  assert actual==collections.Counter(roots),(name,action,actual)
              assert sum(r.get('Action')=='pass' and 'Test' not in r for r in rows)==1
              if name=='cleanup94-repository':
                  for child in ('pending','complete_before_canary'):
                      node='TestFailedUnwitnessedExpansionCleanupPostgresWholeLifecycle/'+child
                      assert sum(r.get('Action')=='pass' and r.get('Test')==node for r in rows)==1,node+' mandatory real read-only owner continuation'
              summary[name]={'roots':roots,'passed':len(roots),'skipped':0}
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_COMMIT']
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'])
          value={'schema':'failed_unwitnessed_expansion_cleanup_exact_Source_CI_v1','source_commit':os.environ['SOURCE_COMMIT'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'postgres_major':int(os.environ['FAILED_SERVING_TEST_PG_MAJOR']),'schema_version':94,'race':True,'count':1,'total_roots':8,'summary':summary,'historical_schema93_census_unchanged':True,'declared_storage_and_transport_fixtures_only':True,'cloud_SDK_execution':False,'native_Guest_qualification':False,'production_authority':False}
          (p/'CLEANUP94-CENSUS.PUBLIC.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          print(json.dumps(value,sort_keys=True))
          PY_CLEANUP94
      - name: Retain original outcomes and exact executed census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-serving-source-pg${{ matrix.postgres }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FAILED_SERVING_LOGS }}
          if-no-files-found: error
          retention-days: 14

  retirement-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: failed-serving-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '1'
      CAPACITY_RECOVERY_FIXTURE_ONLY: 'true'
      FAILED_SERVING_FIXTURE_ADMIN_URL: postgres://postgres:failed-serving-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      FAILED_SERVING_TEST_PG_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert exact Source and both recovery fixture exclusions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          logs="$RUNNER_TEMP/retirement-forward-source-pg$FAILED_SERVING_TEST_PG_MAJOR"
          mkdir -m 0700 "$logs"
          printf 'RETIREMENT_FORWARD_LOGS=%s\n' "$logs" >> "$GITHUB_ENV"
          go list -json ./repository > "$logs/build-default.json"
          go list -json -tags=recoveryfixture ./repository > "$logs/build-fixture.json"
          go list -json -tags=nativequalification ./repository > "$logs/build-native.json"
          go list -json -tags=recoveryfixture,nativequalification ./repository > "$logs/build-both.json"
          python3 - "$logs" <<'PY_EXCLUSION'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          for name,present in [('default',False),('fixture',True),('native',False),('both',False)]:
              row=json.loads((p/f'build-{name}.json').read_text())
              assert row['ImportPath']=='github.com/dakasa-yggdrasil/yggdrasil-core/repository'
              for target in ('failed_serving_recoveryfixture.go','guest_retirement_forward_recoveryfixture.go','failed_expansion_cleanup_recoveryfixture.go'):
                  assert (target in row.get('GoFiles',[])) is present,(name,target,'fixture inclusion drift')
                  assert (target in row.get('IgnoredGoFiles',[])) is (not present)
          print('BOTH_RECOVERY_FIXTURES_EXCLUDED_FROM_DEFAULT_AND_NATIVEQUALIFICATION')
          PY_EXCLUSION
      - name: Qualify separate partial-poweroff authority and both original contexts
        shell: bash
        run: |
          set -Eeuo pipefail
          record() {
            local name="$1"; shift
            set +e
            "$@" > "$RETIREMENT_FORWARD_LOGS/$name.stdout" 2> "$RETIREMENT_FORWARD_LOGS/$name.stderr"
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$RETIREMENT_FORWARD_LOGS/$name.exit"
            return "$rc"
          }
          failed=0
          record capacity go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=2m -json ./internal/capacity -run '^TestGuestRetirementForward' || failed=1
          record repository go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=12m -json ./repository -run '^(TestGuestRetirementForward(LivePostgres|HistoricalAndAtomicityPostgres|LivePendingHistoricalResumePostgres|ClosedGuardsPostgres|MissingPrefixPostgres|StorageDecoderIsClosedAndAtomic|FailedCallerTimeline|ReadonlyObserverJoins|ReadonlyFreshCustodyPostgres|OrdinaryReadonlyCustodyPostgres)|TestGuestRetirementV2NativeReadContentRequiresWholeOriginalReturn)$' || failed=1
          record continuation_repository go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=6m -json ./repository -run '^TestGuestRetirementForwardContinuationPostgres$' || failed=1
          record message go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=5m -json ./controllers/message -run '^TestGuestRetirementForward' || failed=1
          record http go test -buildvcs=true -tags=recoveryfixture -p=1 -race -count=1 -timeout=4m -json ./controllers/httpapi -run '^TestGuestRetirementForward' || failed=1
          [[ "$failed" == 0 ]]
          python3 - <<'PY_FORWARD_CENSUS'
          import collections,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['RETIREMENT_FORWARD_LOGS']);base='github.com/dakasa-yggdrasil/yggdrasil-core/'
          expected={
            'capacity':('internal/capacity',['TestGuestRetirementForwardAuthenticatedWholePrefix']),
            'repository':('repository',[
              'TestGuestRetirementForwardLivePostgres',
              'TestGuestRetirementForwardHistoricalAndAtomicityPostgres',
              'TestGuestRetirementForwardLivePendingHistoricalResumePostgres',
              'TestGuestRetirementForwardClosedGuardsPostgres',
              'TestGuestRetirementForwardMissingPrefixPostgres',
              'TestGuestRetirementForwardStorageDecoderIsClosedAndAtomic',
              'TestGuestRetirementForwardFailedCallerTimeline',
              'TestGuestRetirementForwardReadonlyObserverJoins',
              'TestGuestRetirementForwardReadonlyFreshCustodyPostgres',
              'TestGuestRetirementForwardOrdinaryReadonlyCustodyPostgres',
              'TestGuestRetirementV2NativeReadContentRequiresWholeOriginalReturn']),
            'continuation_repository':('repository',['TestGuestRetirementForwardContinuationPostgres']),
            'message':('controllers/message',[
              'TestGuestRetirementForwardAWSReadDoesNotRelabelPendingAsOff',
              'TestGuestRetirementForwardWorkflowMetadataNeverInventsCallerSuccess',
              'TestGuestRetirementForwardLiveWorkflowDoesNotReplayGuestPostgres',
              'TestGuestRetirementForwardHistoricalPlanClaimsBeforeCoveragePostgres',
              'TestGuestRetirementForwardFinishOrderingAndOriginalBudgets',
              'TestGuestRetirementForwardContinuationKnownDestroyOnly',
              'TestGuestRetirementForwardSourceReadClocksPostgres',
              'TestGuestRetirementForwardReadonlyEnvelopeHasNoCallbackAuthority',
              'TestGuestRetirementForwardOrdinaryReadonlySourceClocksPostgres']),
            'http':('controllers/httpapi',[
              'TestGuestRetirementForwardClosedHistoricalCAS',
              'TestGuestRetirementForwardRequiresCurrentAdministrativeHuman',
              'TestGuestRetirementForwardSummaryPreservesFailureAndHidesOriginals',
              'TestGuestRetirementForwardHistoricalHTTPPostgres'])}
          summary={}
          for name,(package,roots) in expected.items():
              assert (p/(name+'.exit')).read_text().strip()=='0',name+' original go exit'
              rows=[json.loads(line) for line in (p/(name+'.stdout')).read_text().splitlines()]
              assert rows and all(r.get('Package')==base+package for r in rows),name+' package drift'
              assert not any(r['Action'] in ('skip','fail') for r in rows),name+' skipped/failed mandatory case'
              assert 'WARNING: DATA RACE' not in (p/(name+'.stderr')).read_text()
              for action in ('run','pass'):
                  actual=collections.Counter(r['Test'] for r in rows if r['Action']==action and 'Test' in r and '/' not in r['Test'])
                  assert actual==collections.Counter(roots),(name,action,actual)
                  if name=='message':
                      continuation='TestGuestRetirementForwardContinuationKnownDestroyOnly/'
                      children=['settled','confirmed','missing_receipt','foreign_grant','empty_expected_grant','empty_receipt_grant','issued','uncertain','rejected','transport_incomplete','receipt_error','inventory_error','floor_error','floor_cancelled','completion_error','no_deadline','insufficient_reserve','cancelled']
                      actual=collections.Counter(r['Test'] for r in rows if r['Action']==action and r.get('Test','').startswith(continuation))
                      assert actual==collections.Counter(continuation+child for child in children),(name,action,'continuation case census',actual)
              assert sum(r['Action']=='pass' and 'Test' not in r for r in rows)==1,name+' package pass'
              summary[name]={'package':base+package,'roots':roots,'passed':len(roots),'skipped':0}
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_COMMIT']
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'])
          value={'schema':'guest_retirement_partial_poweroff_forward_exact_Source_CI_v1','source_commit':os.environ['SOURCE_COMMIT'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'postgres_major':int(os.environ['FAILED_SERVING_TEST_PG_MAJOR']),'schema_version':93,'race':True,'count':1,'total_roots':sum(len(v[1]) for v in expected.values()),'summary':summary,'historical16_root_census_preserved_separately':True,'declared_storage_and_transport_fixtures_only':True,'cloud_SDK_execution':False,'native_Guest_qualification':False,'production_authority':False}
          (p/'CENSUS.PUBLIC.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          print(json.dumps(value,sort_keys=True))
          PY_FORWARD_CENSUS
      - name: Build qualified rollback-only inspection companion
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          go build -mod=readonly -trimpath -buildvcs=true -o "$RETIREMENT_FORWARD_LOGS/retirement-forward-inspect-linux-amd64" ./cmd/retirement-forward-inspect
          go version -m "$RETIREMENT_FORWARD_LOGS/retirement-forward-inspect-linux-amd64" > "$RETIREMENT_FORWARD_LOGS/inspection-build-metadata.txt"
          python3 - <<'PY_INSPECTION'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RETIREMENT_FORWARD_LOGS'])
          binary=p/'retirement-forward-inspect-linux-amd64'
          raw=binary.read_bytes();metadata=(p/'inspection-build-metadata.txt').read_text()
          assert raw[:4]==b'\x7fELF' and raw[4]==2 and raw[5]==1 and int.from_bytes(raw[18:20],'little')==62
          assert 'vcs.revision='+os.environ['SOURCE_COMMIT'] in metadata and 'vcs.modified=false' in metadata
          assert 'CGO_ENABLED=0' in metadata and 'GOOS=linux' in metadata and 'GOARCH=amd64' in metadata
          value={'schema':'retirement_forward_readonly_inspection_build_v1','diagnostic_source':os.environ['SOURCE_COMMIT'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'binary_sha256':hashlib.sha256(raw).hexdigest(),'binary_bytes':len(raw),'production_execution':False,'admission_authority':False}
          (p/'INSPECTION-BUILD.PUBLIC.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY_INSPECTION
      - name: Retain original forward qualification outcomes and executed census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retirement-forward-source-pg${{ matrix.postgres }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RETIREMENT_FORWARD_LOGS }}
          if-no-files-found: error
          retention-days: 14
