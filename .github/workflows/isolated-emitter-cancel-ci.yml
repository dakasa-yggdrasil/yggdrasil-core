name: Isolated sender FD custody and quiescence CI
on:
  push:
    branches: [codex/isolated-emitter-cancel-ci-20261031]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate systemd sender and retain BPF FDs after termination
        run: |
          set -eu
          sudo modprobe xt_bpf
          target="$(sudo mktemp -d /run/ci-isolated-sender.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp -R .github/diagnostics/controller-integration/. "$target/"
          sudo chmod -R go-w "$target"
          sudo systemd-run --quiet --wait --pipe --unit="ci-custodian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=RuntimeMaxSec=60s --setenv=CI_CUSTODIAN_UNIT="ci-custodian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service" --setenv=CI_GUARDED_FIXTURE=1 --setenv=CI_HOST_NETNS="$(readlink /proc/self/ns/net)" /usr/bin/unshare --net -- /usr/bin/python3 -B "$target/verify_isolated_sender.py"

      - name: Reject forged sender BPF identity
        run: |
          set -eu
          target="$(sudo mktemp -d /run/ci-isolated-bad-fd.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp -R .github/diagnostics/controller-integration/. "$target/"
          sudo chmod -R go-w "$target"
          sudo systemd-run --quiet --wait --pipe --unit="ci-custodian-bad-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=RuntimeMaxSec=60s --setenv=CI_GUARDED_FIXTURE=1 --setenv=CI_BAD_FD_TEST=1 \
            --setenv=CI_HOST_NETNS="$(readlink /proc/self/ns/net)" /usr/bin/unshare --net -- /usr/bin/python3 -B "$target/verify_isolated_sender.py"

      - name: Verify sender-session netfilter socket lifetime fence
        run: |
          set -eu
          target="$(sudo mktemp -d /run/ci-session-custody.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp -R .github/diagnostics/controller-integration/. "$target/"
          sudo chmod -R go-w "$target"
          sudo systemd-run --quiet --wait --pipe --unit="ci-session-custody-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=RuntimeMaxSec=30s --setenv=CI_GUARDED_FIXTURE=1 \
            --setenv=CI_HOST_NETNS="$(readlink /proc/self/ns/net)" /usr/bin/unshare --net -- /usr/bin/python3 -B "$target/verify_sender_session_custody.py"
