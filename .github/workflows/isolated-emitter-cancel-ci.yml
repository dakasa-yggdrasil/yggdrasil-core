name: Isolated sender FD custody and quiescence CI
on:
  push:
    branches: [codex/isolated-emitter-cancel-ci-20261031]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate systemd sender and retain BPF FDs after termination
        run: |
          set -eu
          sudo modprobe xt_bpf
          target="$(sudo mktemp -d /run/ci-isolated-sender.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp -R .github/diagnostics/controller-integration/. "$target/"
          sudo chmod -R go-w "$target"
          sudo systemd-run --quiet --wait --pipe --unit="ci-custodian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=RuntimeMaxSec=60s /usr/bin/unshare --net -- /usr/bin/python3 -B "$target/verify_isolated_sender.py"
