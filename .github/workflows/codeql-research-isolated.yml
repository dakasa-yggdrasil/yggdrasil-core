name: Isolated CodeQL Action protected reference comparison
on:
  push:
    branches: ['elastic/codeql-evidence-diagnostic-20261030']
permissions:
  contents: read
  security-events: read
jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            suite: go
            mode: manual
          - language: actions
            suite: actions
            mode: none
          - language: javascript-typescript
            suite: javascript
            mode: none
          - language: python
            suite: python
            mode: none
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify protected tag identity
        run: |
          set -euo pipefail
          test "$(git ls-remote --tags https://github.com/dakasa-yggdrasil/yggdrasil-core.git refs/tags/codeql-r1 | cut -f1)" = 7fb2e71f23ddc306cd0a58c0ca5d4bbebc425026
      - id: init
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          config-file: dakasa-yggdrasil/yggdrasil-core/.github/codeql/remote.yml@codeql-r1
      - if: matrix.language == 'go'
        name: Build Core
        run: go build -p 2 ./...
      - id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-action-results
      - name: Compare with default suite
        env:
          CODEQL_BIN: ${{ steps.init.outputs.codeql-path }}
          CODEQL_DBS: ${{ steps.analyze.outputs.db-locations }}
          TASK_SUITE: ${{ matrix.suite }}
          TASK_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          database="$(printf '%s' "$CODEQL_DBS" | jq -er 'to_entries | if length == 1 then .[0].value else error("expected one database") end')"
          "$CODEQL_BIN" database analyze "$database" "codeql/${TASK_SUITE}-queries:codeql-suites/${TASK_SUITE}-code-scanning.qls" --format=sarif-latest --output="$RUNNER_TEMP/original.sarif" --threads=2 2>&1 | tee "$RUNNER_TEMP/baseline.log"
          mapfile -t candidates < <(find "$RUNNER_TEMP/codeql-action-results" -name '*.sarif' -type f)
          test "${#candidates[@]}" -eq 1
          if [ "$TASK_LANGUAGE" = go ]; then
            python3 .github/codeql-research/compare_suites.py "$RUNNER_TEMP/original.sarif" "${candidates[0]}"
            python3 .github/codeql-research/verify.py "$RUNNER_TEMP/original.sarif" "${candidates[0]}"
          else
            python3 .github/codeql-research/compare_other_suites.py "$RUNNER_TEMP/original.sarif" "${candidates[0]}"
          fi
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-action-exact-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/original.sarif
            ${{ runner.temp }}/baseline.log
            ${{ runner.temp }}/codeql-action-results/*.sarif
          if-no-files-found: ignore
          retention-days: 3
