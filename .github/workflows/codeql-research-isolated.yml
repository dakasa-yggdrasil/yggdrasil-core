name: Isolated CodeQL non-Go suite equivalence experiment
on:
  push:
    branches: ['elastic/codeql-evidence-diagnostic-20261030']
permissions:
  contents: read
jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: setup
        uses: github/codeql-action/setup-codeql@v4
        with:
          languages: ${{ matrix.language }}
      - name: Build database with test configuration
        env:
          CODEQL_BIN: ${{ steps.setup.outputs.codeql-path }}
          TASK_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          "$CODEQL_BIN" version
          (cd .github/codeql-research && "$CODEQL_BIN" pack install)
          "$CODEQL_BIN" database create "$RUNNER_TEMP/codeql-db" --language="$TASK_LANGUAGE" --source-root=. --codescanning-config=.github/codeql-research/codeql-config-research.yml
      - name: Analyze default and candidate suites
        env:
          CODEQL_BIN: ${{ steps.setup.outputs.codeql-path }}
          TASK_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          "$CODEQL_BIN" database analyze "$RUNNER_TEMP/codeql-db" "codeql/${TASK_LANGUAGE}-queries:codeql-suites/${TASK_LANGUAGE}-code-scanning.qls" --format=sarif-latest --output="$RUNNER_TEMP/original.sarif" --threads=2 2>&1 | tee "$RUNNER_TEMP/original.log"
          "$CODEQL_BIN" database analyze "$RUNNER_TEMP/codeql-db" --format=sarif-latest --output="$RUNNER_TEMP/narrow.sarif" --threads=2 2>&1 | tee "$RUNNER_TEMP/narrow.log"
      - name: Compare all reported rule IDs and findings
        run: python3 .github/codeql-research/compare_other_suites.py "$RUNNER_TEMP/original.sarif" "$RUNNER_TEMP/narrow.sarif"
      - name: Preserve reports and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-suite-reports-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/original.sarif
            ${{ runner.temp }}/narrow.sarif
            ${{ runner.temp }}/original.log
            ${{ runner.temp }}/narrow.log
          if-no-files-found: ignore
          retention-days: 3
