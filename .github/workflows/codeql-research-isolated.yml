name: Isolated CodeQL action and immutable query experiment
on:
  push:
    branches: ['elastic/codeql-evidence-diagnostic-20261030']
permissions:
  contents: read
  security-events: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify reference identity before analysis
        run: |
          set -euo pipefail
          test "$(git ls-remote --tags https://github.com/dakasa-yggdrasil/yggdrasil-core.git refs/tags/codeql-research-c55-20261030 | cut -f1)" = c55c0a7856a39dbd523be30c099e51b136ad9ce6
      - id: init
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          config-file: .github/codeql-research/codeql-config-external-research.yml
      - name: Build Core
        run: go build -p 2 ./...
      - id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-action-results
      - name: Compare with default Go suite and positive controls
        env:
          CODEQL_BIN: ${{ steps.init.outputs.codeql-path }}
          CODEQL_DB: ${{ fromJSON(steps.analyze.outputs.db-locations).go }}
        run: |
          set -euo pipefail
          "$CODEQL_BIN" database analyze "$CODEQL_DB" codeql/go-queries:codeql-suites/go-code-scanning.qls --format=sarif-latest --output="$RUNNER_TEMP/original.sarif" --threads=2
          candidate="$RUNNER_TEMP/codeql-action-results/go.sarif"
          test -f "$candidate"
          python3 .github/codeql-research/compare_suites.py "$RUNNER_TEMP/original.sarif" "$candidate"
          python3 .github/codeql-research/verify.py "$RUNNER_TEMP/original.sarif" "$candidate"
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-action-external-query-reports
          path: |
            ${{ runner.temp }}/original.sarif
            ${{ runner.temp }}/codeql-action-results/*.sarif
          if-no-files-found: ignore
          retention-days: 3
