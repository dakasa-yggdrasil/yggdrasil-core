name: Export ECR pull renewer OCI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed Source S1 commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  export-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      CONTROL_COMMIT: ${{ github.sha }}
      SOURCE_CATALOG_SHA256: 50034fdd81321fb547bedb6c0af4af873c0c9115c0e0c5c0909566e7bb8b5dd2
      FIXED_BASE_IMAGE: docker.io/library/python@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
      FIXED_PLATFORM: linux/amd64
      RUNTIME_CONTEXT: infrastructure/ecr-pull-renewer
      PYTHONDONTWRITEBYTECODE: '1'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Validate dispatch identities before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" != "$CONTROL_COMMIT" ]]

      # Immutable official action commit refs reviewed before Control publication.
      - name: Checkout Source S1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 official ref reviewed
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact clean Source S1 before any generated writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['SOURCE_REF'] or not re.fullmatch('[0-9a-f]{40}', head):
              raise SystemExit('Source S1 checkout mismatch')
          if not re.fullmatch('[0-9a-f]{40}', os.environ['CONTROL_COMMIT']):
              raise SystemExit('Control S2 identity invalid')
          if head == os.environ['CONTROL_COMMIT']:
              raise SystemExit('Source S1 and Control S2 must be distinct')
          status = subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=all', '--ignored'], text=True)
          if status:
              raise SystemExit('Source S1 must be clean before generated writes')
          pins = {
              'Dockerfile': {'sha256': '73642d1ce12aaa565accdbcdb64c4f0af75a908fa0b2e82023f1db43114859a4', 'bytes': 509},
              'requirements.lock': {'sha256': 'ab81ac4e45f887b20d8d0692fdcd13ee40a7dccb1b6127e9e6d78ae643eb14d3', 'bytes': 764},
              'pure_refresh.py': {'sha256': '407ebbbb7bf3b418095f39eb29efcbea19ca8b996be298e79efc005118819334', 'bytes': 7486},
              'refresh_once.py': {'sha256': 'ec4da26a25b480ab7180cc9a36fb00df1dda060593b38035cb616eb22e962677', 'bytes': 14525},
          }
          context = Path(os.environ['RUNTIME_CONTEXT'])
          frozen_inputs = {
              '.dockerignore': {'sha256': '49c361317711bf7973cdb1b1aeae093b3d3d073e50268a0a2fd7a3fdd600352f', 'bytes': 67},
              'ADMISSION.TEMPLATE.json': {'sha256': '0744c33d9fd253a7c3f282890feccb2099da02220578d3933d6f032ec6332e6b', 'bytes': 1004},
              'Dockerfile': {'sha256': '73642d1ce12aaa565accdbcdb64c4f0af75a908fa0b2e82023f1db43114859a4', 'bytes': 509},
              'KUBERNETES.TEMPLATE.json': {'sha256': 'c5b5d2396603d8d63961eafee78f03296f32c85af57c845e36bdc0617134f4d7', 'bytes': 6742},
              'pure_refresh.py': {'sha256': '407ebbbb7bf3b418095f39eb29efcbea19ca8b996be298e79efc005118819334', 'bytes': 7486},
              'refresh_once.py': {'sha256': 'ec4da26a25b480ab7180cc9a36fb00df1dda060593b38035cb616eb22e962677', 'bytes': 14525},
              'render_manifest.py': {'sha256': '07e0c2392e41bfff244c3c7d6b869f2fa6ad5f8addedae301d51c07beee0a619', 'bytes': 2186},
              'requirements.lock': {'sha256': 'ab81ac4e45f887b20d8d0692fdcd13ee40a7dccb1b6127e9e6d78ae643eb14d3', 'bytes': 764},
              'test_admission_and_sdk.py': {'sha256': '34a8edb3e9c083404c1a6ac3627844fb6f4763a8775cf8ff016a996126390bea', 'bytes': 9761},
              'test_pure_refresh.py': {'sha256': '00f9bba7040439c24478a2787594369da7639f08c61beff167690160e8eb8323', 'bytes': 11221},
              'test_refresh_once.py': {'sha256': 'd878e68d096ede7240462d9d56d6728423c862e382a2a4e832f09e0c5978f25a', 'bytes': 12978},
              'test_ttl_boundary.py': {'sha256': '6fa19ba4f9990e1a28d740cdc6f4ad9382718d64111228f12471b83f8e276a34', 'bytes': 2087},
          }
          if {p.name for p in context.iterdir()} != set(frozen_inputs) | {'README.md'}:
              raise SystemExit('Twelve frozen inputs plus operator README roster mismatch')
          if {name: frozen_inputs[name] for name in pins} != pins:
              raise SystemExit('Image pins must match frozen input pins')
          for name, expected in frozen_inputs.items():
              path = context / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Frozen input must identify a regular file')
              raw = path.read_bytes()
              if {'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)} != expected:
                  raise SystemExit('Frozen input descriptor mismatch')
          print(json.dumps({'source_commit': head, 'control_commit': os.environ['CONTROL_COMMIT'],
                            'source_catalog_sha256': os.environ['SOURCE_CATALOG_SHA256'],
                            'source_clean_before_generated_writes': True}, sort_keys=True))
          PY

      - name: Prepare isolated generated output directories
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'export').mkdir(mode=0o700)
          (Path(os.environ['GITHUB_WORKSPACE']) / 'work').mkdir(mode=0o700, exist_ok=True)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 official ref reviewed
        with:
          python-version: '3.12'

      - name: Install only hash-locked binary SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          if python -I -B -m pip install --require-hashes --only-binary=:all: -r "$RUNTIME_CONTEXT/requirements.lock" > "$RUNNER_TEMP/export/SDK-INSTALL.stdout.txt" 2>&1; then
            cat "$RUNNER_TEMP/export/SDK-INSTALL.stdout.txt"
          else
            task_install_exit=$?
            cat "$RUNNER_TEMP/export/SDK-INSTALL.stdout.txt"
            exit "$task_install_exit"
          fi

      - name: Run all forty offline tests with no skips
        shell: bash
        run: |
          set -euo pipefail
          export ECR_TEST_SDK_DIR="$(python -I -B -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          if python -I -B - > "$RUNNER_TEMP/export/TESTS.stdout.txt" 2>&1 <<'PY'
          import json, os, sys, unittest
          from pathlib import Path
          context = Path(os.environ['RUNTIME_CONTEXT']).resolve()
          sys.path.insert(0, str(context))
          if not os.environ.get('ECR_TEST_SDK_DIR'):
              raise SystemExit('Locked SDK path is required; no skip normalization')
          suite = unittest.TestLoader().discover(str(context), pattern='test_*.py', top_level_dir=str(context))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          summary = {'tests_run': result.testsRun, 'failures': len(result.failures),
                     'errors': len(result.errors), 'skipped': len(result.skipped),
                     'successful': result.wasSuccessful()}
          export = Path(os.environ['RUNNER_TEMP']) / 'export'
          (export / 'TEST-RETURN.PUBLIC.json').write_text(json.dumps(summary, sort_keys=True) + '\n')
          print(json.dumps(summary, sort_keys=True))
          if result.testsRun != 40 or not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
          then
            cat "$RUNNER_TEMP/export/TESTS.stdout.txt"
          else
            task_test_exit=$?
            cat "$RUNNER_TEMP/export/TESTS.stdout.txt"
            exit "$task_test_exit"
          fi

      - name: Set up existing Buildx toolchain
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 official ref reviewed

      - name: Build one OCI archive without registry authentication or publication
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx build \
              --platform "$FIXED_PLATFORM" \
              --provenance=false \
              --sbom=false \
              --progress=plain \
              --label "org.opencontainers.image.revision=$SOURCE_REF" \
              --label "io.dakasa.source.catalog.sha256=$SOURCE_CATALOG_SHA256" \
              --metadata-file "$RUNNER_TEMP/export/BUILDKIT-METADATA.PUBLIC.json" \
              --output "type=oci,dest=$RUNNER_TEMP/export/ecr-pull-renewer.oci.tar,oci-mediatypes=true,compression=gzip,force-compression=true" \
              --build-arg "PYTHON_BASE_IMAGE=$FIXED_BASE_IMAGE" \
              --file "$RUNTIME_CONTEXT/Dockerfile" \
              "$RUNTIME_CONTEXT" > "$RUNNER_TEMP/export/BUILD.stdout.txt" 2>&1; then
            cat "$RUNNER_TEMP/export/BUILD.stdout.txt"
          else
            task_build_exit=$?
            cat "$RUNNER_TEMP/export/BUILD.stdout.txt"
            exit "$task_build_exit"
          fi

      - name: Export original Source S1 and Control S2 provenance and archive descriptor
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          control = os.environ['CONTROL_COMMIT']
          if head != os.environ['SOURCE_REF'] or not re.fullmatch('[0-9a-f]{40}', control):
              raise SystemExit('Source or control identity changed')
          if head == control:
              raise SystemExit('Source S1 and Control S2 must be distinct')
          for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'):
              if not re.fullmatch('[0-9]+', os.environ[key]) or int(os.environ[key]) <= 0:
                  raise SystemExit('Original run identity invalid')
          pins = {
              'Dockerfile': {'sha256': '73642d1ce12aaa565accdbcdb64c4f0af75a908fa0b2e82023f1db43114859a4', 'bytes': 509},
              'requirements.lock': {'sha256': 'ab81ac4e45f887b20d8d0692fdcd13ee40a7dccb1b6127e9e6d78ae643eb14d3', 'bytes': 764},
              'pure_refresh.py': {'sha256': '407ebbbb7bf3b418095f39eb29efcbea19ca8b996be298e79efc005118819334', 'bytes': 7486},
              'refresh_once.py': {'sha256': 'ec4da26a25b480ab7180cc9a36fb00df1dda060593b38035cb616eb22e962677', 'bytes': 14525},
          }
          context = Path(os.environ['RUNTIME_CONTEXT'])
          frozen_inputs = {
              '.dockerignore': {'sha256': '49c361317711bf7973cdb1b1aeae093b3d3d073e50268a0a2fd7a3fdd600352f', 'bytes': 67},
              'ADMISSION.TEMPLATE.json': {'sha256': '0744c33d9fd253a7c3f282890feccb2099da02220578d3933d6f032ec6332e6b', 'bytes': 1004},
              'Dockerfile': {'sha256': '73642d1ce12aaa565accdbcdb64c4f0af75a908fa0b2e82023f1db43114859a4', 'bytes': 509},
              'KUBERNETES.TEMPLATE.json': {'sha256': 'c5b5d2396603d8d63961eafee78f03296f32c85af57c845e36bdc0617134f4d7', 'bytes': 6742},
              'pure_refresh.py': {'sha256': '407ebbbb7bf3b418095f39eb29efcbea19ca8b996be298e79efc005118819334', 'bytes': 7486},
              'refresh_once.py': {'sha256': 'ec4da26a25b480ab7180cc9a36fb00df1dda060593b38035cb616eb22e962677', 'bytes': 14525},
              'render_manifest.py': {'sha256': '07e0c2392e41bfff244c3c7d6b869f2fa6ad5f8addedae301d51c07beee0a619', 'bytes': 2186},
              'requirements.lock': {'sha256': 'ab81ac4e45f887b20d8d0692fdcd13ee40a7dccb1b6127e9e6d78ae643eb14d3', 'bytes': 764},
              'test_admission_and_sdk.py': {'sha256': '34a8edb3e9c083404c1a6ac3627844fb6f4763a8775cf8ff016a996126390bea', 'bytes': 9761},
              'test_pure_refresh.py': {'sha256': '00f9bba7040439c24478a2787594369da7639f08c61beff167690160e8eb8323', 'bytes': 11221},
              'test_refresh_once.py': {'sha256': 'd878e68d096ede7240462d9d56d6728423c862e382a2a4e832f09e0c5978f25a', 'bytes': 12978},
              'test_ttl_boundary.py': {'sha256': '6fa19ba4f9990e1a28d740cdc6f4ad9382718d64111228f12471b83f8e276a34', 'bytes': 2087},
          }
          if {p.name for p in context.iterdir()} != set(frozen_inputs) | {'README.md'}:
              raise SystemExit('Twelve frozen inputs plus operator README roster mismatch')
          if {name: frozen_inputs[name] for name in pins} != pins:
              raise SystemExit('Image pins must match frozen input pins')
          for name, expected in frozen_inputs.items():
              path = context / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Frozen input must identify a regular file')
              raw = path.read_bytes()
              if {'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)} != expected:
                  raise SystemExit('Frozen input descriptor mismatch')
          export = Path(os.environ['RUNNER_TEMP']) / 'export'
          raw = (export / 'ecr-pull-renewer.oci.tar').read_bytes()
          archive = {'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)}
          provenance = {
              'source_catalog_sha256': os.environ['SOURCE_CATALOG_SHA256'],
              'control_commit': control,
              'source_commit': head,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'base_image': os.environ['FIXED_BASE_IMAGE'],
              'platform': os.environ['FIXED_PLATFORM'],
              'source_files': pins,
          }
          for name, value in (('ARCHIVE.PUBLIC.json', archive), ('PROVENANCE.PUBLIC.json', provenance)):
              with (export / name).open('x', encoding='utf-8') as stream:
                  stream.write(json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n')
          print(json.dumps({'source_commit': head, 'control_commit': control,
                            'run_id': provenance['run_id'], 'run_attempt': provenance['run_attempt'],
                            'archive': archive}, sort_keys=True))
          PY

      - name: Preserve exact archive, provenance, metadata and failure outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 official ref reviewed
        with:
          name: ecr-pull-renewer-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
