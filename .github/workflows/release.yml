name: release

# Publishes the yggdrasil-core container image to
# ghcr.io/dakasa-yggdrasil/yggdrasil-core.
#
# Triggers:
#   - `vX.Y.Z` tags: tagged release (multi-arch, tagged + "latest").
#   - push to main: rolling "edge" tag + sha-based immutable tag.
#   - manual dispatch: re-run against current main for repairs.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dakasa-yggdrasil/yggdrasil-core
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=yggdrasil-core
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Token used by the console-build stage to clone the private
          # dakasa-yggdrasil/yggdrasil-console repo. BuildKit mounts it
          # at /run/secrets/github_token only during the RUN that needs
          # it; never lands in an image layer.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
