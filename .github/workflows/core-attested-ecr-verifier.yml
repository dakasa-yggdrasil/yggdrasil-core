name: Independently verify a distinct Core ECR import

on:
  push:
    branches:
      - candidate/core-ddd-ecr-verify-20261031

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write
  artifact-metadata: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download exact ECR producer receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-attested-ecr-receipts-41248618470-1
          path: receipts
          run-id: 41248618470
          github-token: ${{ github.token }}

      - name: Verify producer identity, attestations and original returns
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dakasa-yggdrasil/yggdrasil-core
        run: |
          set -eu
          producer=159fcb92ad1eabf5f8f082f3a37523ecef52a1e2
          workflow=dakasa-yggdrasil/yggdrasil-core/.github/workflows/core-attested-ecr-producer.yml
          mkdir verified
          gh api "repos/$GH_REPO/actions/runs/41248618470" > verified/producer-run.json
          jq -e --arg head "$producer" '.id == 41248618470 and .run_attempt == 1 and .head_sha == $head and .path == ".github/workflows/core-attested-ecr-producer.yml" and .status == "completed" and .conclusion == "success" and .repository.full_name == "dakasa-yggdrasil/yggdrasil-core"' verified/producer-run.json >/dev/null
          for spec in \
            '.github/workflows/core-attested-ecr-producer.yml:25a321f86e11782670a0100b117b8113346a24f64787f76994af839abfc0d44d' \
            '.github/scripts/ecr_attested_import.py:c83cfdc28c8312c2ee54f9b54e583f91d47d8558f941e8965d8366afe0e07afa' \
            '.github/scripts/ecr_frozen_native.py:4326b46957a8df0ef8b940e864df41b68db74a70349b1f9007d731c512c955bc' \
            '.github/scripts/aws_cli_public_key.asc:279541b6dd1c831a260ee0f9fb71d63bbcc14ebc4bf62c605336e86c11d4eefb'; do
            path=${spec%:*}
            digest=${spec##*:}
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/$path?ref=$producer" > verified/current-source
            test "$(sha256sum verified/current-source | cut -d' ' -f1)" = "$digest"
          done
          rm verified/current-source
          test "$(sha256sum .github/scripts/verify_ecr_receipts.py | cut -d' ' -f1)" = b71c481a7bb3c14ef1ef450736f13b12d04ddd9ec6c81c54075ce02e045c5031
          for name in ABSENCE-BEFORE ECR-RETURN IMPORT-INTENT DESCRIBE-001 LAYERS LOCAL-COPY LOCAL-CREATE LOCAL-IMAGE MANIFEST PULL-ORIGINAL STS; do
            test -f "receipts/$name.json"
            gh attestation verify "receipts/$name.json" --repo "$GH_REPO" \
              --signer-workflow "$workflow" --source-digest "$producer" \
              --source-ref refs/heads/candidate/core-ddd-ecr-producer-20261031 \
              --deny-self-hosted-runners --format json > "verified/$name.attestation.json"
          done
          python3 -I -B .github/scripts/verify_ecr_receipts.py

      - name: Attest independent verification summary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verified/summary.json

      - name: Preserve independent verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-attested-ecr-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified/
          if-no-files-found: error
          retention-days: 2
