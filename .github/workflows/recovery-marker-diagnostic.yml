name: Disposable recovery marker proof diagnostic
on:
  push:
    branches: [codex/recovery-marker-proof-20261031]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify marker owner and real systemd sender terminality
        run: |
          set -eu
          if ! command -v nft >/dev/null || ! command -v ip >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y nftables iproute2; fi
          target="$(sudo mktemp -d /run/ci-recovery-marker.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp .github/diagnostics/guarded-service/{guarded_unit_identity.py,recovery_terminality_DRAFT.py,verify_recovery_terminality.py,systemd_peer.py} "$target/"
          sudo cp -R .github/diagnostics/controller-integration/runtime "$target/runtime"
          sudo cp .github/diagnostics/controller-integration/coverage.py "$target/coverage.py"
          sudo modprobe xt_bpf
          sudo chmod -R go-w "$target"
          sudo unshare --net --mount --propagation private -- /usr/bin/python3 -B "$target/verify_recovery_terminality.py"
      - name: Verify independent custody, socket lifetime and restart fence
        run: |
          set -eu
          target="$(sudo mktemp -d /run/ci-recovery-custody.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp .github/diagnostics/recovery-custody/*.py "$target/"
          sudo cp .github/diagnostics/guarded-service/{guarded_unit_identity.py,recovery_terminality_DRAFT.py} "$target/"
          sudo cp -R .github/diagnostics/controller-integration/runtime "$target/runtime"
          sudo chmod -R go-w "$target"
          sudo /usr/bin/python3 -B "$target/verify_custody.py"
          sudo rm -rf "$target"
          target="$(sudo mktemp -d /run/ci-recovery-custody.XXXXXX)"
          sudo cp .github/diagnostics/recovery-custody/*.py "$target/"
          sudo cp .github/diagnostics/guarded-service/{guarded_unit_identity.py,recovery_terminality_DRAFT.py} "$target/"
          sudo cp -R .github/diagnostics/controller-integration/runtime "$target/runtime"
          sudo chmod -R go-w "$target"
          sudo /usr/bin/python3 -B "$target/verify_custody.py" --early-custodian-death
      - name: Verify native child inherits writer lease across exec
        run: |
          set -eu
          if ! command -v nft >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y nftables; fi
          target="$(sudo mktemp -d /run/ci-native-lease.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp .github/diagnostics/recovery-custody/*.py "$target/"
          sudo cp -R .github/diagnostics/controller-integration/runtime "$target/runtime"
          sudo chmod -R go-w "$target"
          sudo /usr/bin/python3 -B "$target/verify_native_lease.py"
      - name: Observe marker, genid, frozen BPF and fresh Readers in private netns
        run: |
          set -eu
          target="$(sudo mktemp -d /run/ci-recovery-read.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp -R .github/diagnostics/controller-integration/. "$target/"
          sudo chmod -R go-w "$target"
          unit="ci-recovery-read-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo systemd-run --quiet --wait --pipe --unit="$unit" \
            --setenv=CI_CONTROLLER_UNIT="$unit.service" \
            /usr/bin/unshare --net -- /usr/bin/python3 -B "$target/verify_recovery_read.py"
      - name: Join 50-rule references and four real nft collections
        run: |
          set -eu
          sudo modprobe xt_bpf
          target="$(sudo mktemp -d /run/ci-recovery-attached.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp -R .github/diagnostics/controller-integration/. "$target/"
          sudo chmod -R go-w "$target"
          unit="ci-recovery-attached-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          host_netns="$(readlink /proc/self/ns/net)"
          sudo systemd-run --quiet --wait --pipe --unit="$unit" \
            --setenv=CI_CONTROLLER_UNIT="$unit.service" --setenv=CI_GUARDED_FIXTURE=1 \
            --setenv=CI_RECOVERY_READ_ONLY=1 --setenv=CI_HOST_NETNS="$host_netns" \
            /usr/bin/unshare --net -- /usr/bin/python3 -B "$target/verify_controller_guardian.py"
