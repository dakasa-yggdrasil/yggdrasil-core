name: Disposable nft quota and priority diagnostic
on:
  push:
    branches: [codex/nft-quota-diagnostic-20261031]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check tools
        run: |
          set -eu
          if ! command -v nft >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y nftables; fi
          nft --version
          systemctl --version | head -n 1
          uname -a
      - name: Measure niceness with 100 percent quota in private netns
        run: |
          set -eu
          mkdir -m 777 "$RUNNER_TEMP/nft-quota"
          sudo env PROBE_OUTPUT="$RUNNER_TEMP/nft-quota/result.json" unshare --net -- python3 -B .github/diagnostics/nft-priority/quota_experiment.py
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nft-quota-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nft-quota/
          if-no-files-found: warn
          retention-days: 2
