          (root/'CORE-ASSETS.json').write_text(json.dumps(receipt,sort_keys=True))
          PY
          docker image inspect --format '{{json .RootFS.Layers}}' "$IMAGE" > image-export-artifacts/rootfs-diffids.json
          docker tag "$IMAGE" "yggdrasil-core:verified-source-export-$GITHUB_RUN_ID"
          docker image save --platform=linux/amd64 --output image-export-artifacts/image.tar "yggdrasil-core:verified-source-export-$GITHUB_RUN_ID"
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          root=pathlib.Path('image-export-artifacts');native=pathlib.Path(os.environ['RUNNER_TEMP'])/'core-source-image-exports';archive=root/'image.tar'
          assert 0<archive.stat().st_size<=512*1024**2
          def digest(path):
