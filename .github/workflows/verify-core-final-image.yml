          receipt={'schema':'exact_published_Core_and_Goose_SQL_archive_v1','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'image':os.environ['IMAGE'],'expected_compiler_source':os.environ['EXPECTED_SOURCE'],'verification_workflow_source':os.environ['GITHUB_SHA'],'verification_run':os.environ['GITHUB_RUN_ID'],'platform':'linux/amd64','image_executed':False,'production_activation':False,'archive_sha256':digest(archive),'archive_bytes':archive.stat().st_size,'binary_sha256':digest(native/'yggdrasil-core'),'rootfs_diffids':json.loads((root/'rootfs-diffids.json').read_text()),'core_assets':json.loads((native/'CORE-ASSETS.json').read_text()),'goose_native_build_info':(native/'goose-build.txt').read_text(),'entrypoint_file_sha256':digest(native/'entrypoint.sh'),'all_image_migrations_match_exact_clean_source':True}
