          assert {p.name:digest(p) for p in expected} == frozen_sql_pins
          assert [int(p.name[:5]) for p in expected] == [v for v in range(1,76) if v!=40]
          pins=[]
          for a,b in zip(expected,observed):
              assert stat.S_ISREG(a.lstat().st_mode) and stat.S_ISREG(b.lstat().st_mode)
              assert re.fullmatch('[0-9]{5}_[a-z0-9_]+\\.sql',a.name) and a.read_bytes()==b.read_bytes()
              pins.append({'path':'app/db/migrations/'+a.name,'bytes':a.stat().st_size,'sha256':digest(a)})
          assert stat.S_ISREG((root/'entrypoint.sh').lstat().st_mode)
          assert (root/'entrypoint.sh').read_bytes()==pathlib.Path('source/scripts/entrypoint.sh').read_bytes()
