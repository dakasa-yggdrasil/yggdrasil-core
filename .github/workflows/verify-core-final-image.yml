name: Verify and export exact final Core image

on:
  push:
    branches: ['codex/core-d10-exact-image-export-2f2f581-d515859']

permissions:
  contents: read
  packages: read

jobs:
  immutable-image:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IMAGE: ghcr.io/dakasa-yggdrasil/yggdrasil-core@sha256:d515859a831d914e11152ea6a2be6e45b6356d1a243fe145dae71a6e1e1a4130
      EXPECTED_SOURCE: 2f2f581fe5921535b16b96c7b68546fe597774f5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f2f581fe5921535b16b96c7b68546fe597774f5
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify actual published Core and Goose without executing the image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git -C source status --porcelain)"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir image-export-artifacts
          mkdir "$RUNNER_TEMP/core-source-image-exports"
          docker pull --platform=linux/amd64 "$IMAGE"
          container=$(docker create --platform=linux/amd64 --network=none "$IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/yggdrasil-core" "$RUNNER_TEMP/core-source-image-exports/yggdrasil-core"
          docker cp "$container:/app/goose" "$RUNNER_TEMP/core-source-image-exports/goose"
          docker cp "$container:/app/entrypoint.sh" "$RUNNER_TEMP/core-source-image-exports/entrypoint.sh"
          docker cp "$container:/app/db/migrations" "$RUNNER_TEMP/core-source-image-exports/migrations"
          go version -m "$RUNNER_TEMP/core-source-image-exports/yggdrasil-core" > image-export-artifacts/binary-build.txt
          go version -m "$RUNNER_TEMP/core-source-image-exports/goose" > "$RUNNER_TEMP/core-source-image-exports/goose-build.txt"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'core-source-image-exports'
          def digest(path):
              raw=path.read_bytes();assert 0<len(raw)<=128*1024**2
              return hashlib.sha256(raw).hexdigest()
          for name,module in [('yggdrasil-core','github.com/dakasa-yggdrasil/yggdrasil-core'),('goose','github.com/dakasa-yggdrasil/yggdrasil-core/scripts/goose')]:
              text=(pathlib.Path('image-export-artifacts/binary-build.txt') if name=='yggdrasil-core' else root/'goose-build.txt').read_text()
              rows=[line.lstrip('\t') for line in text.splitlines()[1:]]
              assert rows.count('path\t'+module)==1
              settings={}
              for line in rows:
                  if line.startswith('build\t'):
                      key,value=line[6:].split('=',1);assert key not in settings;settings[key]=value
              assert settings['vcs.revision']==os.environ['EXPECTED_SOURCE'] and settings['vcs.modified']=='false'
              assert settings['GOOS']=='linux' and settings['GOARCH']=='amd64' and settings['CGO_ENABLED']=='0'
              assert settings.get('-tags','')==''
          expected=sorted(pathlib.Path('source/db/migrations').iterdir())
          observed=sorted((root/'migrations').iterdir())
          assert pathlib.Path('source/db/migrations/00075_native_denied_failed_returned_ack_dispositions.sql').stat().st_size==52147
          assert len(expected)==len(observed)==74 and [p.name for p in expected]==[p.name for p in observed]
