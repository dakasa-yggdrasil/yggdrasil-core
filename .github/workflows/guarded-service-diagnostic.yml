name: Disposable Guardian service integration diagnostic
on:
  push:
    branches: [codex/nice-inheritance-diagnostic-20261031]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install nftables if required
        run: |
          set -eu
          if ! command -v nft >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y nftables; fi
      - name: Verify service identity and attestation against real nft genid
        run: sudo unshare --net -- /usr/bin/python3 -B .github/diagnostics/guarded-service/verify_integration.py
      - name: Verify real root-owned systemd peer identity
        run: |
          set -eu
          target="$(sudo mktemp -d /run/ci-guarded-identity.XXXXXX)"
          trap 'sudo rm -rf "$target"' EXIT
          sudo cp .github/diagnostics/guarded-service/{guarded_unit_identity.py,systemd_peer.py,systemd_peer_47.py,verify_systemd_identity.py,guardian47.py,guarded_nl.py} "$target/"
          sudo /usr/bin/python3 -B "$target/verify_systemd_identity.py"
      - name: Probe real BPF primitives in a private network namespace
        run: sudo unshare --net -- /usr/bin/python3 -B .github/diagnostics/guarded-service/verify_bpf_capability.py
      - name: Exercise original controller and Guardian on disposable nft
        run: |
          set -eu
          sudo modprobe xt_bpf
          host_netns="$(readlink /proc/self/ns/net)"
          for order in deny-first positive-first; do
            target="$(sudo mktemp -d /run/ci-controller-guardian.XXXXXX)"
            trap 'sudo rm -rf "$target"' EXIT
            sudo cp -R .github/diagnostics/controller-integration/. "$target/"
            sudo chmod -R go-w "$target"
            unit="ci-capacity-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${order}"
            sudo systemd-run --quiet --wait --pipe --unit="$unit" --property=RuntimeMaxSec=120s \
              --setenv=CI_GUARDED_FIXTURE=1 --setenv=CI_HOST_NETNS="$host_netns" --setenv=CI_FAILURE_ORDER="$order" \
              --setenv=CI_CONTROLLER_UNIT="$unit.service" \
              /usr/bin/unshare --net -- /usr/bin/python3 -B "$target/verify_controller_guardian.py"
            sudo rm -rf "$target"
            trap - EXIT
          done
      - name: Verify BPF absolute expiry and Reader failure semantics
        run: sudo unshare --net -- /usr/bin/python3 -B .github/diagnostics/controller-integration/runtime/ci_bpf_expiry.py
