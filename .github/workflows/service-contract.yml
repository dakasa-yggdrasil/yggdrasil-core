name: Service contract

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  svc-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Exact reviewed private Commons publication and clean tracked-tree digest.
      COMMONS_SOURCE_COMMIT: 194f4c473f298b3e4ca460a8725601f6f6d87deb
      COMMONS_REVIEWED_TREE_SHA256: d32c21740070924340b55591a007eb1e9983745bfe58c27a265a23edd2be8592
      CORE_V1_COMPATIBILITY_SOURCE: 34d66457f393f50989d6fe4f217e03c581083830
      GOMAXPROCS: "2"
      GOMEMLIMIT: 512MiB
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact reviewed checker source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMONS_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMMONS_REVIEWED_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Read exact private checker source with existing application
        id: checker-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.YGGDRASIL_APP_ID }}
          private-key: ${{ secrets.YGGDRASIL_APP_PEM }}
          owner: dakasa-co
          repositories: dakasa-commons
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: dakasa-co/dakasa-commons
          ref: ${{ env.COMMONS_SOURCE_COMMIT }}
          path: .ci-service-doctor
          token: ${{ steps.checker-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .ci-service-doctor/go.mod
          cache: false
      - name: Verify and compile owning checker
        shell: bash
        run: |
          set -euo pipefail
          checker_source="$RUNNER_TEMP/service-doctor-source"
          test ! -e "$checker_source"
          mv .ci-service-doctor "$checker_source"
          python3 scripts/ci/verify_service_doctor_source.py "$checker_source" "$COMMONS_SOURCE_COMMIT" "$COMMONS_REVIEWED_TREE_SHA256"
          cd "$checker_source"
          go test -mod=readonly -p 1 -count=1 -timeout=60s ./cli/svccmd ./cli/svccatalog ./cli/repocmd
          go build -mod=readonly -p 1 -trimpath -buildvcs=true -o "$RUNNER_TEMP/service-doctor" ./cmd/service-doctor
          go version -m "$RUNNER_TEMP/service-doctor" > "$RUNNER_TEMP/service-doctor-build.txt"
          grep -q "vcs.revision=$COMMONS_SOURCE_COMMIT" "$RUNNER_TEMP/service-doctor-build.txt"
          grep -q 'vcs.modified=false' "$RUNNER_TEMP/service-doctor-build.txt"
          sha256sum "$RUNNER_TEMP/service-doctor"
      - name: First qualify the new owning checker against the published complete v1 Core
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORE_V1_COMPATIBILITY_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$CORE_V1_COMPATIBILITY_SOURCE"
          legacy="$RUNNER_TEMP/core-v1-compatibility"
          git worktree add --detach "$legacy" "$CORE_V1_COMPATIBILITY_SOURCE"
          python3 - "$legacy" <<'PY_LEGACY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          source = root / 'docs/service-contract/source/sources.json'
          census = json.loads(source.read_bytes())
          assert census['schema'] == 'core_source_interface_census_v1'
          assert len(census['records']) == 894 and source.stat().st_size <= 131072
          PY_LEGACY
          (cd "$legacy" && "$RUNNER_TEMP/service-doctor" svc doctor --quiet)
          git worktree remove "$legacy"
      - name: Verify complete source census
        run: python3 scripts/ci/service_contract_inventory.py --root . --out docs/service-contract/source --verify
      - name: Verify every v2 fact against the unchanged complete source selection
        run: |
          python3 - <<'PY_SOURCE_UNION'
          from pathlib import Path
          import hashlib, importlib.util, json
          spec = importlib.util.spec_from_file_location('source_census', 'scripts/ci/service_contract_inventory.py')
          census = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(census)
          root = Path('.')
          expected = census.generate(root)['sources']
          index = json.loads((root / 'docs/service-contract/source/sources.json').read_bytes())
          assert index['schema'] == 'core_source_interface_census_index_v2'
          assert 1 <= len(index['shards']) <= 16
          actual = {}
          total = (root / 'docs/service-contract/source/sources.json').stat().st_size
          for ref in index['shards']:
              raw = (root / ref['path']).read_bytes()
              assert len(raw) == ref['bytes'] <= 131072
              assert hashlib.sha256(raw).hexdigest() == ref['sha256']
              leaf = json.loads(raw)
              assert leaf['schema'] == 'core_source_interface_census_shard_v2'
              assert len(leaf['records']) == ref['records']
              assert not set(actual).intersection(leaf['records'])
              actual.update(leaf['records'])
              total += len(raw)
          assert actual == expected and len(actual) == index['total_records'] <= 4096
          assert total <= 2097152
          PY_SOURCE_UNION
      - name: Verify exact Core service contract
        run: '"$RUNNER_TEMP/service-doctor" svc doctor --quiet'
