name: Native OIDC protocol integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-oidc-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oidc-integration-test-only
          POSTGRES_DB: oidc_native_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oidc_native_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOWORK: "off"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: oidc_native_integration
      DB_USER: postgres
      DB_PASSWORD: oidc-integration-test-only
      DB_SSLMODE: disable
      DB_URL: postgres://postgres:oidc-integration-test-only@127.0.0.1:5432/oidc_native_integration?sslmode=disable
      REQUIRE_OIDC_NATIVE_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply all production migrations to ephemeral PostgreSQL
        run: go run ./scripts/goose up
      - name: Exercise native authorization, PKCE tokens and userinfo
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout=5m ./controllers/oidc -run '^TestNativeLoopbackProtocolIntegration$' | tee native-oidc-results.jsonl
      - name: Require the protocol gate and every scenario to have executed
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          events = [json.loads(line) for line in Path("native-oidc-results.jsonl").read_text().splitlines() if line.strip()]
          root = "TestNativeLoopbackProtocolIntegration"
          scenarios = {"success_get", "success_post", "wrong_verifier", "code_replay", "token_redirect_mismatch", "unregistered_redirect"}
          expected = {root} | {f"{root}/{name}" for name in scenarios}
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = {event.get("Test") for event in events if event.get("Action") == "skip"}
          missing = expected - passed
          if missing or skipped:
              raise SystemExit(f"Native OIDC gate did not run completely: missing={sorted(missing)}, skipped={sorted(skipped)}")
          print("Native OIDC PostgreSQL protocol gate passed every scenario. External identity-provider login remains a separate acceptance step.")
          PY
      # ADR-0021: the logical event publisher grant resolver joins any
      # instance version onto the active one and onto the active
      # integration_type. sqlmock only pins its SQL text; this proves the
      # semantics against the same migrated schema. The REQUIRE flag turns a
      # missing DB_URL into a failure instead of a skip.
      - name: Resolve logical integration instances against the migrated schema
        if: ${{ !cancelled() }}
        env:
          REQUIRE_INSTANCE_IDENTITY_DB_TEST: "true"
        run: go test -count=1 -timeout=5m -v -run '^TestIntegrationInstanceIdentityAgainstPostgres$' ./repository
      - name: Exercise declared contacts and complete directory snapshots
        if: ${{ !cancelled() }}
        env:
          REQUIRE_DIRECTORY_CONTACT_POSTGRES: "true"
        shell: bash
        run: |
          set -euo pipefail
          # The directory reads the complete identity graph. Sequential package
          # execution keeps intentionally corrupt graph fixtures isolated.
          go test -json -p 1 -count=1 -timeout=5m ./repository ./controllers/httpapi ./controllers/oidc -run '^Test(DeclaredPhoneAuthority|DeclaredPhoneLegacyProjection|DirectorySnapshotReferencesAndDeclarationStates|DeclaredPhoneReadRequiresExactGrant|HumanPhoneEnrollmentHTTP|DirectorySnapshotHTTPRevision|PhoneProfileSetupRecoveryHTTP|PhoneProfileNativeIssuance|TypedTeamLeadership|TeamLeadershipHTTP|PhoneDeclarationCAS)Postgres$|^Test(CreateTeam_NewOwnerBecomesLeadMember|CreateTeam_PreservesExistingMemberRole|UpdateTeam_RemovedOwnerDeactivatesOwnerSyncMembership|UpdateTeam_RemovedOwnerPreservesManualMembership)$' | tee contact-directory-results.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "TestDeclaredPhoneAuthorityPostgres",
              "TestDeclaredPhoneLegacyProjectionPostgres",
              "TestDirectorySnapshotReferencesAndDeclarationStatesPostgres",
              "TestDeclaredPhoneReadRequiresExactGrantPostgres",
              "TestHumanPhoneEnrollmentHTTPPostgres",
              "TestDirectorySnapshotHTTPRevisionPostgres",
              "TestPhoneProfileNativeIssuancePostgres",
              "TestPhoneProfileSetupRecoveryHTTPPostgres",
              "TestTypedTeamLeadershipPostgres",
              "TestTeamLeadershipHTTPPostgres",
              "TestPhoneDeclarationCASPostgres",
              "TestCreateTeam_NewOwnerBecomesLeadMember",
              "TestCreateTeam_PreservesExistingMemberRole",
              "TestUpdateTeam_RemovedOwnerDeactivatesOwnerSyncMembership",
              "TestUpdateTeam_RemovedOwnerPreservesManualMembership",
          }
          events = [json.loads(line) for line in Path("contact-directory-results.jsonl").read_text().splitlines() if line.strip()]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = {event.get("Test") for event in events if event.get("Action") == "skip"}
          if expected - passed or skipped:
              raise SystemExit(f"Directory gate incomplete: missing={sorted(expected - passed)}, skipped={sorted(skipped)}")
          print("All declared-contact and directory PostgreSQL scenarios executed.")
          PY
      - name: Prove contact OTP MFA against the migrated PostgreSQL schema
        if: ${{ !cancelled() }}
        env:
          REQUIRE_MFA_CONTACT_POSTGRES: "true"
        shell: bash
        run: |
          set -euo pipefail
          go test -json -p 1 -count=1 -timeout=5m ./repository ./controllers/httpapi ./internal/auth/mfa -run '^Test(MFAContactOTPPostgres|TOTPConfirmationPostgres|RecentContactSessionProofPostgres|MFAContactOTPHTTPPostgres|ContactOTPSecrets|ContactOTPHMACRFC4231|ContactOTPStrictCodeShape|ContactDeliverySelector|ContactLoginBindingForVersion)$' | tee mfa-contact-results.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = "TestMFAContactOTPPostgres"
          scenarios = {
              "delivered_enrollment_replay",
              "wrong_attempt_budget",
              "cross_owner_channel_purpose_context",
              "contact_change_invalidates_factor_and_challenge",
              "contact_change_invalidates_factor_and_challenge/email",
              "contact_change_invalidates_factor_and_challenge/sms",
              "enrollment_link_authority_and_replay",
              "email_round_trip_does_not_revive_proof",
              "send_limits_failed_sends_and_purposes",
              "password_epoch_rotates_and_never_revives",
              "concurrent_single_consume",
              "concurrent_single_send",
              "expired_revoked_suspended_password_changed",
              "expired_revoked_suspended_password_changed/expired",
              "expired_revoked_suspended_password_changed/suspended",
              "expired_revoked_suspended_password_changed/password",
              "expired_revoked_suspended_password_changed/session_revoked",
              "last_primary_factor_and_reset",
              "atomic_session_and_replay",
              "reset_serializes_before_session_issuance",
              "concurrent_last_primary_guard",
              "unconfigured_contact_does_not_count_as_alternate",

              "undecryptable_sms_does_not_count_as_alternate",
              "automatic_contact_login_without_enrollment",
              "automatic_contact_login_without_enrollment/email",
              "automatic_contact_login_without_enrollment/sms",
              "automatic_contact_change_permits_new_otp",
              "automatic_contact_change_permits_new_otp/email",
              "automatic_contact_change_permits_new_otp/sms",
              "automatic_profile_contact_allows_last_passkey_removal",
              "automatic_profile_contact_allows_last_passkey_removal/email",
              "automatic_profile_contact_allows_last_passkey_removal/sms",
          }
          expected = {root} | {f"{root}/{name}" for name in scenarios} | {
              "TestContactOTPSecrets", "TestContactOTPHMACRFC4231", "TestContactOTPStrictCodeShape",
              "TestContactDeliverySelector",
              "TestContactLoginBindingForVersion",
              "TestMFAContactOTPHTTPPostgres",
          }
          http_root = "TestMFAContactOTPHTTPPostgres"
          expected |= {f"{http_root}/{name}" for name in {
              "email_automatic_password_login", "sms_automatic_password_login",
              "contact_login_preserves_classic_factor_confirmation",
              "contact_login_preserves_classic_factor_confirmation/pending_begin_only",
              "contact_login_preserves_classic_factor_confirmation/confirmed_totp",
              "contact_login_preserves_classic_factor_confirmation/pending_after_contact",
              "sso_only_options_never_offer_password_login",
              "failed_delivery_never_activates_or_discloses_a_challenge",
              "failed_delivery_never_activates_or_discloses_a_challenge/failed",
              "failed_delivery_never_activates_or_discloses_a_challenge/pending",
              "failed_delivery_never_activates_or_discloses_a_challenge/provider_error",
              "no_contact_activation_or_disable_routes",
              "setup_uses_automatic_contact_without_creating_session",
              "expired_recent_contact_proof_cannot_change_password",
          }}
          proof_root = "TestRecentContactSessionProofPostgres"
          totp_root = "TestTOTPConfirmationPostgres"
          expected |= {totp_root} | {f"{totp_root}/{name}" for name in {
              "pending_after_global_mfa", "stale_replacement_code", "enroll_link_single_use", "reset_clears_confirmation",
          }}
          expected |= {proof_root} | {f"{proof_root}/{name}" for name in {
              "metadata_cannot_forge_proof",
              "proof_is_atomic_and_password_mismatch_preserves_it",
              "context_and_lifetime_fail_closed",
              "context_and_lifetime_fail_closed/expired",
              "context_and_lifetime_fail_closed/email_changed",
              "context_and_lifetime_fail_closed/email_round_trip",
              "context_and_lifetime_fail_closed/sms_changed",
              "context_and_lifetime_fail_closed/password_changed",
              "context_and_lifetime_fail_closed/revoked",
              "context_and_lifetime_fail_closed/session_expired",
              "context_and_lifetime_fail_closed/owner_suspended",
              "context_and_lifetime_fail_closed/foreign_session",
              "password_change_and_revocation_commit_with_proof",
              "concurrent_proof_consumption_is_single_use",
          }}
          events = [json.loads(line) for line in Path("mfa-contact-results.jsonl").read_text().splitlines() if line.strip()]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = {event.get("Test") for event in events if event.get("Action") == "skip"}
          if expected - passed or skipped:
              raise SystemExit(f"Contact MFA PostgreSQL gate incomplete: missing={sorted(expected - passed)}, skipped={sorted(skipped)}")
          print("Contact OTP MFA PostgreSQL and cryptographic gates executed every required scenario.")
          PY
      # ADR-0087: a collaborator who can no longer sign in loses every session
      # and refresh token, and no session, session reuse or OIDC mint path
      # serves them. The unit job has no PostgreSQL, so the DB_URL lifecycle
      # tests never ran there; this step proves the status policy against the
      # migrated schema. The REQUIRE flag turns a missing DB_URL into a failure
      # instead of a skip, and packages run sequentially because the status
      # clock reads every collaborator.
      - name: Prove the collaborator session lifecycle against the migrated schema
        if: ${{ !cancelled() }}
        env:
          REQUIRE_SESSION_LIFECYCLE_POSTGRES: "true"
        shell: bash
        run: |
          set -euo pipefail
          go test -json -p 1 -count=1 -timeout=5m ./repository ./controllers/oidc ./controllers/httpapi ./addons -run '^Test(CollaboratorStatusSessionPolicyPostgres|CollaboratorStatusNativeIssuancePostgres|CollaboratorSessionLifecycleHTTPPostgres|StatusClockOffboardTerminatesSessionsPostgres)$' | tee session-lifecycle-results.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          suites = {
              "TestCollaboratorStatusSessionPolicyPostgres": {
                  "leaving_active_terminates_once",
                  "leaving_active_terminates_once/on_leave",
                  "leaving_active_terminates_once/suspended",
                  "leaving_active_terminates_once/offboarded",
                  "same_status_write_is_a_noop",
                  "non_status_write_terminates_nothing",
                  "moving_between_statuses_that_cannot_sign_in_terminates_again",
                  "reactivation_revokes_leftovers_without_an_event",
                  "rollback_keeps_sessions_and_emits_nothing",
                  "concurrent_suspends_terminate_once",
                  "resolution_reads_current_status",
              },
              "TestCollaboratorStatusNativeIssuancePostgres": {
                  "pending_start", "on_leave", "suspended", "offboarded",
              },
              "TestCollaboratorSessionLifecycleHTTPPostgres": {
                  "suspend_ends_the_session_and_unsuspend_does_not_revive",
                  "patch_status_terminates",
                  "long_absence_terminates_vacation_does_not",
                  "offboard_emits_exactly_one_session_terminated",
                  "session_reuse_falls_back_to_interactive_login",
              },
              "TestStatusClockOffboardTerminatesSessionsPostgres": {
                  "offboard_terminates_sessions",
                  "promotion_revokes_leftovers_without_an_event",
              },
          }
          expected = set()
          for root, scenarios in suites.items():
              expected |= {root} | {f"{root}/{name}" for name in scenarios}
          events = [json.loads(line) for line in Path("session-lifecycle-results.jsonl").read_text().splitlines() if line.strip()]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = {event.get("Test") for event in events if event.get("Action") == "skip"}
          if expected - passed or skipped:
              raise SystemExit(f"Session lifecycle gate incomplete: missing={sorted(expected - passed)}, skipped={sorted(skipped)}")
          print("Every collaborator session lifecycle PostgreSQL scenario executed.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-oidc-protocol-results
          path: |
            native-oidc-results.jsonl
            contact-directory-results.jsonl
            mfa-contact-results.jsonl
            session-lifecycle-results.jsonl
          if-no-files-found: warn
