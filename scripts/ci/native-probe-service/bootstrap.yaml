apiVersion: v1
kind: Namespace
metadata:
  name: native-probe-service-ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: native-probe-service-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller
  namespace: native-probe-service-ci
rules:
  - apiGroups: ['']
    resources: [pods, services]
    verbs: [create, get, list, delete]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
  namespace: native-probe-service-ci
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: native-probe-service-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: native-probe-service-ci-reader
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [native-probe-service-ci]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: native-probe-service-ci-reader
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: native-probe-service-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: native-probe-service-ci-reader
