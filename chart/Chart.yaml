apiVersion: v2
name: yggdrasil-core
description: Yggdrasil — self-hosted workflow and integration control plane
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - yggdrasil
  - workflow
  - integration
  - platform
home: https://github.com/dakasa-yggdrasil/yggdrasil
sources:
  - https://github.com/dakasa-yggdrasil/yggdrasil-core
maintainers:
  - name: Dakasa
    email: support@dakasa.me

# Bitnami subcharts provide Postgres + RabbitMQ in production-ready
# shape (persistence, auth, metrics). Self-hosted deployers can opt
# out of either by setting postgresql.enabled=false or rabbitmq.enabled=false
# in values.yaml and pointing at external instances via external.* blocks.
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: rabbitmq
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
