{{/*
Single secret that bundles: bootstrap admin password, Postgres password
(when using the bundled subchart), and RabbitMQ URL. The Deployment
references these via valueFrom.secretKeyRef so passwords never appear
in the pod spec or env dump.

The admin password is generated only when bootstrap.adminPassword is
empty. `lookup` + `randAlphaNum` gives us idempotency across upgrades:
if a prior install already created the secret we reuse the value
rather than rotating it out from under the operator.
*/}}
{{- $secretName := include "yggdrasil-core.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $generatedAdminPassword := "" -}}
{{- if $existing -}}
  {{- $generatedAdminPassword = index $existing.data "admin-password" | b64dec -}}
{{- end -}}
{{- if not $generatedAdminPassword -}}
  {{- if .Values.bootstrap.adminPassword -}}
    {{- $generatedAdminPassword = .Values.bootstrap.adminPassword -}}
  {{- else -}}
    {{- $generatedAdminPassword = randAlphaNum 24 -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "yggdrasil-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ $generatedAdminPassword | quote }}
  {{- if not .Values.postgresql.enabled }}
  db-password: {{ .Values.external.postgres.passwordSecret.name | default "" | quote }}
  {{- end }}
