apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yggdrasil-core.fullname" . }}
  labels:
    {{- include "yggdrasil-core.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "yggdrasil-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yggdrasil-core.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "yggdrasil-core.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: yggdrasil-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          env:
            - name: PORT
              value: "9080"
            - name: DB_HOST
              value: {{ include "yggdrasil-core.postgresHost" . | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ (ternary .Values.postgresql.auth.database .Values.external.postgres.database .Values.postgresql.enabled) | quote }}
            - name: DB_USER
              value: {{ (ternary .Values.postgresql.auth.username .Values.external.postgres.username .Values.postgresql.enabled) | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ .Release.Name }}-postgresql
                  key: password
                  {{- else }}
                  name: {{ .Values.external.postgres.passwordSecret.name }}
                  key: {{ .Values.external.postgres.passwordSecret.key }}
                  {{- end }}
            {{- if .Values.rabbitmq.enabled }}
            - name: BROKER_URL
              value: {{ printf "amqp://%s:%s@%s-rabbitmq:5672/" .Values.rabbitmq.auth.username .Values.rabbitmq.auth.password .Release.Name | quote }}
            {{- else }}
            - name: BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.rabbitmq.urlSecret.name }}
                  key: {{ .Values.external.rabbitmq.urlSecret.key }}
            {{- end }}
            - name: AUTH_SESSION_TTL_HOURS
              value: {{ .Values.session.ttlHours | quote }}
            - name: AUTH_SESSION_COOKIE_NAME
              value: {{ .Values.session.cookieName | quote }}
            - name: AUTH_SESSION_COOKIE_DOMAIN
              value: {{ .Values.session.cookieDomain | quote }}
            - name: AUTH_SESSION_COOKIE_SECURE
              value: {{ .Values.session.cookieSecure | quote }}
            - name: HTTP_READ_HEADER_TIMEOUT_SECONDS
              value: {{ .Values.http.readHeaderTimeoutSeconds | quote }}
            - name: HTTP_READ_TIMEOUT_SECONDS
              value: {{ .Values.http.readTimeoutSeconds | quote }}
            - name: HTTP_WRITE_TIMEOUT_SECONDS
              value: {{ .Values.http.writeTimeoutSeconds | quote }}
            - name: HTTP_IDLE_TIMEOUT_SECONDS
              value: {{ .Values.http.idleTimeoutSeconds | quote }}
            {{- if .Values.bootstrap.enabled }}
            - name: YGGDRASIL_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.bootstrap.adminUsername | quote }}
            - name: YGGDRASIL_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yggdrasil-core.secretName" . }}
                  key: admin-password
            - name: YGGDRASIL_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrap.adminEmail | quote }}
            - name: YGGDRASIL_BOOTSTRAP_ADMIN_DISPLAY_NAME
              value: {{ .Values.bootstrap.adminDisplayName | quote }}
            - name: YGGDRASIL_BOOTSTRAP_MANIFESTS_PATH
              value: {{ .Values.bootstrap.manifestsPath | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
