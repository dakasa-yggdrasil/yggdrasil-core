# yggdrasil-core — production self-hosted values.
# Defaults target a small single-cluster deployment. Tune resources,
# replicas, and the database/broker sizing for your scale.

# ─── Core image ────────────────────────────────────────────────────────
image:
  repository: ghcr.io/dakasa-yggdrasil/yggdrasil-core
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ─── Replicas / HPA ────────────────────────────────────────────────────
replicaCount: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ─── Scheduling ────────────────────────────────────────────────────────
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ─── Service ───────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 9080
  annotations: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ─── Ingress ───────────────────────────────────────────────────────────
# Disabled by default — deployers typically front yggdrasil-core with
# their own ingress or gateway. Enable and point at your controller
# when you want a reachable URL out of the box.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: yggdrasil.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ─── Postgres dependency ───────────────────────────────────────────────
# Set enabled=false and populate external.postgres to use an existing
# managed Postgres. The auth.database must match a DB where goose can
# run migrations — yggdrasil-core will not create it for you.
postgresql:
  enabled: true
  auth:
    username: yggdrasil
    password: "change-me-postgres"
    database: yggdrasil
  primary:
    persistence:
      size: 8Gi

# ─── Opt-in AMQP rpc.Transport backend ────────────────────────────────
# HTTP is always on. The AMQP backend is opt-in: only enable if any
# integration_type in your catalog declares `transport: rabbitmq`.
# See docs/features/transports.md.
rabbitmq:
  enabled: false
  auth:
    username: yggdrasil
    password: "change-me-rabbitmq"
  persistence:
    size: 4Gi

# ─── External services (when postgresql.enabled / rabbitmq.enabled = false) ─
external:
  postgres:
    host: ""
    port: 5432
    database: yggdrasil
    username: yggdrasil
    # passwordSecret.name + passwordSecret.key point at an existing
    # Kubernetes Secret rather than embedding the password in values.
    passwordSecret:
      name: ""
      key: password
  rabbitmq:
    url: ""            # e.g. amqp://user:pass@host:5672/
    urlSecret:
      name: ""
      key: url

# ─── First-run bootstrap ───────────────────────────────────────────────
# When bootstrap.enabled is true, the deployment passes the
# YGGDRASIL_BOOTSTRAP_* env vars through. The first pod to start against
# an empty DB creates the admin and seeds the baseline catalog.
# Subsequent restarts are no-ops — the addon is gated on "DB has zero
# collaborators".
bootstrap:
  enabled: true
  adminUsername: "admin"
  # adminPassword is persisted to a Kubernetes Secret managed by the
  # chart. Leave empty to have the chart generate a random value at
  # install time (printed in the release notes).
  adminPassword: ""
  adminEmail: ""
  adminDisplayName: "Admin"
  manifestsPath: "/app/docs/bootstrap/seeds"

# ─── Session cookie / HTTP timeouts ────────────────────────────────────
session:
  ttlHours: 720
  cookieName: yggdrasil_session
  cookieDomain: ""
  cookieSecure: true

http:
  readHeaderTimeoutSeconds: 10
  readTimeoutSeconds: 30
  writeTimeoutSeconds: 30
  idleTimeoutSeconds: 120

# ─── Extra env vars ────────────────────────────────────────────────────
# Merged into the container's environment as-is. Use for third-party
# auth provider client secrets referenced by `client_secret_ref`, for
# webhook URLs, or anything else that is deployment-specific.
extraEnv: []
# - name: YGGDRASIL_SOMETHING
#   value: something

# ─── Probes ────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5

# ─── Pod security ──────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
securityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
