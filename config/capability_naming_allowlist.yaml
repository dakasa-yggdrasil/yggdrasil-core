  # ---- Compat alias for observe_identities (deprecated; kept under v0.5.x
  #      shim window so the core re-sync cron does not break during cutover).
  #      Used by database-admin-postgres, github, google-workspace,
  #      secrets-management-aws-secrets-manager. ----
  - list_identities

  # ---- Installation render helpers (ai-runtime, grafana-kubernetes,
  #      rabbitmq-kubernetes, manifest-sources-kustomize) ----
  - generate_installation
  - reconcile_installation

prefix:
  # Math helpers: calculate_iss, calculate_pis, calculate_cofins, …
  - calculate_

  # AWS Identity Center — bulk rename deferred to a separate v2.0.0
  - identity_center_

  # ---- NEW 2026-05-27 sweep prefix expansions ----

  # AWS audit_*: decision-only read helpers that surface candidates for
  # operator review (e.g. audit_kms_keys_unused, audit_security_groups_orphan).
  # Not strictly observe_<resource_type> shape because they carry policy
  # semantics (filter by age/utilization/encryption status). Action-shaped reads.
  - audit_

  # AWS apply_* + schema-migrations apply_* + slack apply_user:
  # one-shot config writes that don't create resources with stable IDs
  # (e.g. apply_iam_password_policy sets an account-wide setting).
  # apply_topology_spec / apply_manifest already listed above as exact —
  # this prefix subsumes them. Action-shaped writes.
  - apply_

  # github scim_*: SCIM domain-bound user-lifecycle ops (RFC 7644).
  # SCIM has its own naming conventions; treat as action helpers.
  - scim_
