# config/capability_naming_allowlist.yaml
#
# Capability names that are intentionally exempt from the universal
# naming convention regex ^(ensure|observe|destroy|discover|on)_.
# Source of truth: docs/superpowers/specs/2026-05-27-yggdrasil-integration-capability-convention.md §5.1
# Heuristic: INTEGRATION_CONTRACT.md §6 (Resource vs Action vs Reactor vs Helper).
#
# Adding to this file requires a PR with a comment explaining why
# the op is action-shaped rather than resource-shaped (Section 3
# heuristic). Entries are exact match unless they end with `*`,
# in which case the prefix matches.
#
# Categories `reactor` and `permission` are auto-exempt by the validator
# (capability_naming.go Allowed()): reactors are event-driven framework
# hooks; permissions are RBAC declarations co-located in action_catalog
# (not actually-callable capabilities). See category list at the bottom.

exact:
  # ---- Pure-function helpers (no provider call, no side effect) ----
  - verify_webhook_signature
  - verify_signature

  # ---- Pre-existing allowlist (preserved) ----
  - send_email
  - send_sms
  - dispatch_workflow
  - merge_pull_request
  - trigger_workflow
  - approve_deployment
  - close_issue
  - reopen_issue

  # RabbitMQ topology — pre-convention but Crossplane-shaped
  - apply_topology_spec
  - describe_topology
  - purge_queue
  - publish_message
  - delete_queue

  # Kubernetes
  - apply_manifest

  # AWS one-shot actions and ops deferred to v2.0.0
  - start_instance_refresh
  - s3_put_object
  - get_ecr_authorization_token
  - set_ecr_lifecycle_policy
  - upsert_secrets_manager_secret
  - restore_secret

  # Reactors not using on_* prefix (historical, category=reactor exempts at code path)
  - on_surface_query
  - efi_webhook_received
  - stripe_webhook_received
  - nfse_webhook_received

  # Financial money-movement actions (irreversible, not resource-shaped)
  - handle_chargeback
  - refund_charge
  - create_payout
  - create_refund

  # EFI ops kept while v2.0.0 deferred (historical, will be renamed)
  - get_charge_status
  - get_statement

  # ============================================================
  # NEW 2026-05-27 sweep (cycle): legitimate action/helper exemptions
  # ============================================================

  # ---- ai-runtime: pure inference actions (no resource) ----
  - chat_completion
  - embed_text
  - transcribe_audio

  # ---- aws: action-shaped reads / decision helpers / one-shot writes ----
  # cost-explorer + ECR read helpers
  - cost_explorer_recommendations
  - list_ecr_images
  - list_ebs_snapshots_orphans
  - list_rds_snapshots_orphans
  - release_elastic_ip

  # ---- database-admin-postgres: SQL action helpers ----
  - alter_user_password
  - drop_user
  - grant_privileges
  - execute_sql
  - select_rows

  # ---- gcp: build/deploy orchestration helpers ----
  - build_project
  - build_and_deploy_entity
  - deploy_entity

  # ---- github: action-shaped capabilities ----
  - catalog_discover
  - grant_team_repository_access
  - classify_workflow_failure
  - read_file_from_repo
  - put_file_contents
  - invite_user_to_org_by_email
  - cancel_org_invitation_by_email
  - configure_saml_sso
  - enforce_saml_sso
  - sync_enterprise_organization_installations
  - disable_pr_auto_assign
  - enable_pr_auto_assign

  # ---- google-workspace: action / membership helpers ----
  - assign_saml_sso
  - provision_mailbox
  - assign_groups
  - create_calendar_invite
  - list_user_groups

  # ---- grafana: config action helpers (also covered by configure_saml_sso above) ----
  - test_saml_login
  - deactivate_user
  - add_user_to_team
  - remove_user_from_team

  # ---- heimdall: pure compute / audit-log helpers ----
  - assess_ecosystem
  - recommend_improvements
  - triage_critical_error
  - auto_remediate_critical
  - optimize_cost
  - recommend_pod_affinity
  - synthesize_remediation_workflow
  - record_guardian_memory
  - query_guardian_memory
  - compute_action_confidence
  - evaluate_safety_gates
  - kill_switch_check
  - rollback_synthesized_workflow
  - propose_code_fix
  - enrich_snapshot_with_logs
  - recommend_notification_target
  - compute_finops_priority

  # ---- kubernetes: action helpers / observations on existing objects ----
